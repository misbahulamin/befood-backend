name: Deploy BeFood Backend to EC2

on:
  push:
    branches:
      - main

  # GitHub Actions থেকে manually deploy করার option
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: befood-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # ------------------------------------------
      # 1. Configure SSH
      # ------------------------------------------
      - name: Setup SSH Connection
        env:
          EC2_HOST: ${{ secrets.BEFOOD_EC2_HOST }}
          EC2_SSH_KEY: ${{ secrets.BEFOOD_EC2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh

          printf '%s\n' "$EC2_SSH_KEY" | tr -d '\r' > ~/.ssh/befood_ec2_key

          chmod 600 ~/.ssh/befood_ec2_key

          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

      # ------------------------------------------
      # 2. Deploy
      # ------------------------------------------
      - name: Deploy BeFood Backend
        env:
          EC2_HOST: ${{ secrets.BEFOOD_EC2_HOST }}
          EC2_USER: ${{ secrets.BEFOOD_EC2_USER }}
        run: |
          ssh \
            -i ~/.ssh/befood_ec2_key \
            -o IdentitiesOnly=yes \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=3 \
            "$EC2_USER@$EC2_HOST" 'bash -se' << 'EOF'

            set -Eeuo pipefail

            PROJECT_DIR="/home/ubuntu/befood-backend"
            VENV_DIR="/home/ubuntu/venv"

            echo "=========================================="
            echo " Starting BeFood Backend Deployment"
            echo "=========================================="

            # ----------------------------------
            # Go to project
            # ----------------------------------
            echo "1. Opening project directory..."

            cd "$PROJECT_DIR"


            # ----------------------------------
            # Update source code (deterministic sync)
            # Always match origin/main. Discard local edits to tracked
            # files (e.g. dirty cron scripts) so deploy never fails on
            # "local changes would be overwritten by merge".
            # Untracked files (.env, logs, sockets) are not removed.
            # ----------------------------------
            echo "2. Syncing working tree to origin/main..."

            git fetch origin main

            git checkout main

            echo "Working tree before reset (dirty tracked files will be discarded):"
            git status --short || true

            git reset --hard origin/main

            if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
              echo "ERROR: HEAD does not match origin/main after reset."
              exit 1
            fi

            echo "Synced to $(git rev-parse --short HEAD)"
            git status --short || true


            # ----------------------------------
            # Activate virtual environment
            # ----------------------------------
            echo "3. Activating virtual environment..."

            source "$VENV_DIR/bin/activate"


            # ----------------------------------
            # Production environment
            # ----------------------------------
            echo "4. Loading production Django environment..."

            export DJANGO_ENV=prod
            export DJANGO_SETTINGS_MODULE=core.settings


            # ----------------------------------
            # Dependencies
            # ----------------------------------
            echo "5. Installing/updating Python dependencies..."

            python -m pip install --upgrade pip
            pip install -r requirements.txt


            # ----------------------------------
            # Django system check
            # ----------------------------------
            echo "6. Running Django system check..."

            python manage.py check


            # ----------------------------------
            # Database migrations
            # ----------------------------------
            echo "7. Applying database migrations..."

            python manage.py migrate --noinput


            # ----------------------------------
            # Static files
            # ----------------------------------
            echo "8. Collecting static files..."

            python manage.py collectstatic --noinput


            # ----------------------------------
            # Cron jobs
            # ----------------------------------
            echo "9. Updating managed cron jobs..."

            if [ -f "$PROJECT_DIR/scripts/cron/install_managed_cron.sh" ]; then
              bash "$PROJECT_DIR/scripts/cron/install_managed_cron.sh"
            else
              echo "Cron installer not found. Skipping cron setup."
            fi


            # ----------------------------------
            # Test nginx before touching service
            # ----------------------------------
            echo "10. Testing Nginx configuration..."

            sudo nginx -t


            # ----------------------------------
            # Restart Gunicorn
            # ----------------------------------
            echo "11. Restarting Gunicorn..."

            sudo supervisorctl restart 'guni:*'

            sleep 3


            # ----------------------------------
            # Check Gunicorn
            # ----------------------------------
            echo "12. Checking Gunicorn status..."

            sudo supervisorctl status


            # ----------------------------------
            # Reload nginx
            # ----------------------------------
            echo "13. Reloading Nginx..."

            sudo systemctl reload nginx


            # ----------------------------------
            # Gunicorn socket check
            # ----------------------------------
            echo "14. Checking Gunicorn socket..."

            test -S "$PROJECT_DIR/app.sock"

            echo "Gunicorn socket exists."


            # ----------------------------------
            # Django internal health check
            # ----------------------------------
            echo "15. Testing Django through Gunicorn..."

            curl \
              --fail \
              --silent \
              --show-error \
              --unix-socket "$PROJECT_DIR/app.sock" \
              -H "Host: api.befood.com.bd" \
              http://localhost/admin/login/ \
              > /dev/null


            echo "=========================================="
            echo " BeFood Backend Deployment Successful"
            echo "=========================================="

          EOF

      # ------------------------------------------
      # 3. Public production checks
      # ------------------------------------------
      - name: Verify Production API
        env:
          EC2_HOST: ${{ secrets.BEFOOD_EC2_HOST }}
        run: |
          echo "Checking public API..."

          curl \
            --fail \
            --silent \
            --show-error \
            --max-time 20 \
            https://api.befood.com.bd/admin/login/ \
            > /dev/null

          echo "Production API is reachable."

      # ------------------------------------------
      # 4. Check Django admin static CSS
      # ------------------------------------------
      - name: Verify Django Admin Static Files
        run: |
          echo "Checking Django admin CSS..."

          curl \
            --fail \
            --silent \
            --show-error \
            --max-time 20 \
            https://api.befood.com.bd/static/admin/css/base.css \
            > /dev/null

          echo "Django admin static files are working."
















